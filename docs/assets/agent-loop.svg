<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="310" viewBox="0 0 1440 310" role="img" aria-labelledby="title desc"><title id="title">The private resident loop</title><desc id="desc">Local perception, personal memory, private decisions, four-turn dialogue, source checks and schedule revisions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#789168" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1440" height="310" fill="#f8f2df" rx="8"/><g font-family="Verdana,sans-serif"><text x="32" y="40" font-size="11" fill="#87916d" letter-spacing="3">HOW ONE RESIDENT MAKES A MOVE</text><rect x="32" y="78" width="198" height="112" fill="#eee8cf" rx="4"/><text x="131" y="107" font-size="11" fill="#9b956c" text-anchor="middle">01 / PERCEIVE</text><text x="131" y="136" font-size="17" fill="#4b674e" text-anchor="middle">Nearby activity</text><text x="131" y="164" font-size="10" fill="#4b674e" text-anchor="middle">range · rooms · occlusion</text><path d="M232 134h29" stroke="#789168" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="266" y="78" width="198" height="112" fill="#eee8cf" rx="4"/><text x="365" y="107" font-size="11" fill="#9b956c" text-anchor="middle">02 / REMEMBER</text><text x="365" y="136" font-size="17" fill="#4b674e" text-anchor="middle">Personal memories</text><text x="365" y="164" font-size="10" fill="#4b674e" text-anchor="middle">own experiences &amp; sources</text><path d="M466 134h29" stroke="#789168" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="78" width="198" height="112" fill="#2e4f3d" rx="4"/><text x="599" y="107" font-size="11" fill="#b9c7a2" text-anchor="middle">03 / DECIDE</text><text x="599" y="136" font-size="17" fill="#fff0cc" text-anchor="middle">One private context</text><text x="599" y="164" font-size="10" fill="#d3ddba" text-anchor="middle">one resident per model call</text><path d="M700 134h29" stroke="#789168" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="734" y="78" width="198" height="112" fill="#eee8cf" rx="4"/><text x="833" y="107" font-size="11" fill="#9b956c" text-anchor="middle">04 / CONVERSE</text><text x="833" y="136" font-size="17" fill="#4b674e" text-anchor="middle">A → B → A → B</text><text x="833" y="164" font-size="10" fill="#4b674e" text-anchor="middle">only delivered utterances</text><path d="M934 134h29" stroke="#789168" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="968" y="78" width="198" height="112" fill="#eee8cf" rx="4"/><text x="1067" y="107" font-size="11" fill="#9b956c" text-anchor="middle">05 / CHECK</text><text x="1067" y="136" font-size="17" fill="#4b674e" text-anchor="middle">Preserve the source</text><text x="1067" y="164" font-size="10" fill="#4b674e" text-anchor="middle">real parentId · derived evidence</text><path d="M1168 134h29" stroke="#789168" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1202" y="78" width="206" height="112" fill="#eee8cf" rx="4"/><text x="1301" y="107" font-size="11" fill="#9b956c" text-anchor="middle">06 / REPLAN</text><text x="1301" y="136" font-size="17" fill="#4b674e" text-anchor="middle">Revise the day</text><text x="1301" y="164" font-size="10" fill="#4b674e" text-anchor="middle">cite experience · track arrival</text><path d="M1307 199v34H130v-33" fill="none" stroke="#b6b995" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="557" y="220" width="327" height="25" fill="#f8f2df" /><text x="720" y="238" font-size="11" fill="#829171" text-anchor="middle">new actions become new personal experiences</text><text x="32" y="283" font-size="10" fill="#989379" >Architecture illustration · live-town-v1 · Real model calls only; failures pause; responses are audited.</text></g></svg>